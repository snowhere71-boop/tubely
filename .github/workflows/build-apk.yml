name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Generate Android Project Files
        run: |
          cd mobile
          flutter create --platforms=android .

      - name: Inject Background Permissions & Audio Service
        run: |
          MANIFEST_PATH="mobile/android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_PATH" ]; then
            # Add required network and background permissions
            sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.WAKE_LOCK"/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK"/>' "$MANIFEST_PATH"
            
            # Inject audio service and media button receiver inside <application>
            python3 -c '
          import xml.etree.ElementTree as ET
          
          # Register namespaces to prevent ns0 prefixes
          ET.register_namespace("android", "http://schemas.android.com/apk/res/android")
          
          tree = ET.parse("mobile/android/app/src/main/AndroidManifest.xml")
          root = tree.getroot()
          app = root.find("application")
          
          android_ns = "{http://schemas.android.com/apk/res/android}"
          
          # Add AudioService
          service = ET.SubElement(app, "service", {
              f"{android_ns}name": "com.ryanheise.audioservice.AudioService",
              f"{android_ns}foregroundServiceType": "mediaPlayback",
              f"{android_ns}exported": "true"
          })
          s_intent = ET.SubElement(service, "intent-filter")
          ET.SubElement(s_intent, "action", {f"{android_ns}name": "android.media.browse.MediaBrowserService"})
          
          # Add MediaButtonReceiver
          receiver = ET.SubElement(app, "receiver", {
              f"{android_ns}name": "com.ryanheise.audioservice.MediaButtonReceiver",
              f"{android_ns}exported": "true"
          })
          r_intent = ET.SubElement(receiver, "intent-filter")
          ET.SubElement(r_intent, "action", {f"{android_ns}name": "android.intent.action.MEDIA_BUTTON"})
          
          tree.write("mobile/android/app/src/main/AndroidManifest.xml", encoding="utf-8", xml_declaration=True)
          '
          fi

      - name: Install dependencies
        run: |
          cd mobile
          flutter pub get

      - name: Build APK
        run: |
          cd mobile
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tubely-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
